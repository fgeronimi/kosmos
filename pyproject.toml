[project]
name = "kosmos"
version = "0.0.1"
description = "Carte des pensées de Marc Aurèle et dashboard d'éval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosmos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
